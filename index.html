        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        const useLocalStorage = (key, initialValue) => {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    return initialValue;
                }
            });
            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.error(error);
                }
            };
            return [storedValue, setValue];

                                                : <span className="bg-slate-200 text-slate-600 text-xs px-3 py-1 rounded-full font-bold">WAITING</span>
                                            }
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="flex gap-4">
                                <button 
                                    onClick={() => onReady(!me.is_ready)}
                                    className={`flex-1 py-3 rounded-lg font-bold transition ${me.is_ready ? 'bg-slate-200 text-slate-700 hover:bg-slate-300' : 'bg-green-500 text-white hover:bg-green-600'}`}
                                >
                                    {me.is_ready ? 'BATAL READY' : 'READY'}
                                </button>
                                
                                {isHost && (
                                    <button 
                                        onClick={onStart}
                                        disabled={!allReady || players.length < 2}
                                        className={`flex-1 py-3 rounded-lg font-bold transition ${allReady && players.length >= 2 ? 'bg-slate-900 text-white hover:bg-slate-800' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                                    >
                                        MULAI GAME
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // This function handles the complex logic and acts as the secure server, run only by the Host.
        const processAction = (state, action, logMsg) => {
            const newState = JSON.parse(JSON.stringify(state)); // Deep copy
            const player = newState.players[action.player_id];
            
            if (!player) return newState;

            const nextTurn = () => {
                newState.turn.doublesCount = 0;
                let nextIdx = (newState.turn.currentIndex + 1) % newState.turnOrder.length;
                
                // Skip bankrupt players
                while(newState.players[newState.turnOrder[nextIdx]].bankrupt) {
                    nextIdx = (newState.turn.currentIndex + 1) % newState.turnOrder.length;
                }
                
                newState.turn.currentIndex = nextIdx;
                newState.turn.currentPlayerId = newState.turnOrder[nextIdx];
                newState.turn.phase = 'WAITING_FOR_ROLL';
                
                // Jail check start of turn
                const nextPlayer = newState.players[newState.turn.currentPlayerId];
                if (nextPlayer.jailStatus) {
                    newState.turn.phase = 'JAIL_DECISION';
                }
            };

            const checkBankrupt = (playerId, amount) => {
                if (newState.players[playerId].money < amount) {
                    newState.turn.phase = 'BANKRUPTCY_RESOLUTION';
                    newState.turn.debt = amount;
                    newState.turn.creditor = 'BANK'; // Simplified creditor to Bank for this gen
                    return true;
                }
                return false;
            };

            switch (action.type) {
                case 'ROLL': {
                    if (newState.turn.phase !== 'WAITING_FOR_ROLL' && newState.turn.phase !== 'JAIL_DECISION') break;
                    
                    const d1 = Math.floor(Math.random() * 6) + 1;
                    const d2 = Math.floor(Math.random() * 6) + 1;
                    const isDouble = d1 === d2;
                    newState.turn.lastDice = [d1, d2];
                    
                    logMsg(`${player.name} melempar dadu: ${d1} & ${d2} ${isDouble ? '(Double!)' : ''}`);

                    if (player.jailStatus) {
                        if (isDouble) {
                            player.jailStatus = false;
                            player.jailAttempts = 0;
                            logMsg(`${player.name} berhasil keluar penjara karena double!`);
                            // Move based on roll
                        } else {
                            player.jailAttempts++;
                            if (player.jailAttempts >= 3) {
                                logMsg(`${player.name} gagal double 3x. Harus bayar Rp500.000.`);
                                player.money -= 500000;
                                player.jailStatus = false;
                                player.jailAttempts = 0;
                            } else {
                                logMsg(`${player.name} tetap di penjara.`);
                                nextTurn();
                                break;
                            }
                        }
                    }

                    if (isDouble && !player.jailStatus) {
                        newState.turn.doublesCount++;
                        if (newState.turn.doublesCount === 3) {
                            logMsg(`${player.name} kena tilang ngebut (Double 3x). Masuk Penjara!`);
                            player.position = 10;
                            player.jailStatus = true;
                            nextTurn();
                            break;
                        }
                    } else {
                        newState.turn.doublesCount = 0; // Reset if not double
                    }

                    // Move
                    const oldPos = player.position;
                    player.position = (player.position + d1 + d2) % 40;
                    
                    // Pass GO
                    if (player.position < oldPos && player.position !== 10 && !player.jailStatus) {
                        player.money += 2000000;
                        logMsg(`${player.name} melewati GAJIAN, dapat Rp2.000.000`);
                    }

                    const tile = BOARD_TILES[player.position];
                    newState.turn.phase = 'ANIMATING'; // Client handles animation, then resolves
                    
                    // Direct Landing Resolution logic for host
                    setTimeout(() => {
                        // This timeout simulates the client sending 'LANDING_RESOLVED' after animation
                        // For a strict single-file host model without complex async delays, we process immediately
                        // and let the client just snap or animate based on state change.
                    }, 0);
                    
                    // To keep it synchronous in this reducer pattern, we resolve landing immediately.
                    // The UI will just show the final state, which is fine for this constraint.
                    
                    if (tile.type === 'PROPERTY' || tile.type === 'TRANSPORT' || tile.type === 'UTILITY') {
                        const propState = newState.properties[tile.id];
                        if (!propState.ownerId) {
                            newState.turn.phase = 'PROPERTY_DECISION';
                        } else if (propState.ownerId !== player.id && !propState.mortgaged) {
                            // Pay Rent
                            let rent = 0;
                            const owner = propState.ownerId;
                            if (tile.type === 'PROPERTY') {
                                rent = tile.rent[propState.level];
                                // Check full set bonus (level 0 but full set = 2x rent)
                                if (propState.level === 0) {
                                    const groupTiles = BOARD_TILES.filter(t => t.group === tile.group).map(t => t.id);
                                    const ownsAll = groupTiles.every(tid => newState.properties[tid].ownerId === owner);
                                    if (ownsAll) rent *= 2;
                                }
                            } else if (tile.type === 'TRANSPORT') {
                                const transCount = BOARD_TILES.filter(t => t.type === 'TRANSPORT').filter(t => newState.properties[t.id].ownerId === owner).length;
                                rent = 250000 * Math.pow(2, transCount - 1);
                            } else if (tile.type === 'UTILITY') {
                                const utilCount = BOARD_TILES.filter(t => t.type === 'UTILITY').filter(t => newState.properties[t.id].ownerId === owner).length;
                                const multiplier = utilCount === 2 ? 10 : 4;
                                rent = (d1 + d2) * multiplier * 10000; // Adjusted utility formula slightly for WNI scale (d1+d2 * 10 * 10000)
                            }
                            
                            logMsg(`${player.name} bayar sewa Rp${rent.toLocaleString()} ke ${newState.players[owner].name}`);
                            player.money -= rent;
                            newState.players[owner].money += rent;
                            
                            if (checkBankrupt(player.id, 0)) break; // If below 0 after rent
                            
                            if (newState.turn.doublesCount > 0) newState.turn.phase = 'WAITING_FOR_ROLL';
                            else nextTurn();
                        } else {
                            // Own property or mortgaged
                            if (newState.turn.doublesCount > 0) newState.turn.phase = 'WAITING_FOR_ROLL';
                            else nextTurn();
                        }
                    } else if (tile.type === 'TAX') {
                        logMsg(`${player.name} bayar ${tile.name} Rp${tile.amount.toLocaleString()}`);
                        player.money -= tile.amount;
                        if (checkBankrupt(player.id, 0)) break;
                        if (newState.turn.doublesCount > 0) newState.turn.phase = 'WAITING_FOR_ROLL';
                        else nextTurn();
                    } else if (tile.type === 'GO_TO_JAIL') {
                        logMsg(`${player.name} MASUK PENJARA!`);
                        player.position = 10;
                        player.jailStatus = true;
                        newState.turn.doublesCount = 0;
                        nextTurn();
                    } else if (tile.type === 'CHANCE' || tile.type === 'COMMUNITY') {
                        // Simplified card draw logic
                        const cardArr = tile.type === 'CHANCE' ? NASIB_CARDS : REALITA_CARDS;
                        const card = cardArr[Math.floor(Math.random() * cardArr.length)];
                        logMsg(`${player.name} dapat kartu: ${card.text}`);
                        
                        if (card.action === 'money') {
                            player.money += card.amount;
                        } else if (card.action === 'move') {
                            player.position = (player.position + card.amount + 40) % 40;
                        } else if (card.action === 'jail') {
                            player.position = 10;
                            player.jailStatus = true;
                            newState.turn.doublesCount = 0;
                        } else if (card.action === 'keep_jail_card') {
                            player.cards.push('ORANG_DALAM');
                        } else if (card.action === 'skip_turn') {
                            // Next turn skips them? Too complex for single state, just end turn now
                            newState.turn.doublesCount = 0;
                        }

                        if (checkBankrupt(player.id, 0)) break;

                        if (newState.turn.doublesCount > 0 && !player.jailStatus) newState.turn.phase = 'WAITING_FOR_ROLL';
                        else if (!player.jailStatus) nextTurn();
                        else nextTurn();
                    } else {
                        // GO, Free Parking, Jail Visiting
                        if (newState.turn.doublesCount > 0) newState.turn.phase = 'WAITING_FOR_ROLL';
                        else nextTurn();
                    }
                    break;
                }

                case 'BUY_PROPERTY': {
                    const tile = BOARD_TILES[player.position];
                    if (player.money >= tile.price) {
                        player.money -= tile.price;
                        newState.properties[tile.id].ownerId = player.id;
                        logMsg(`${player.name} membeli ${tile.name}`);
                    }
                    if (newState.turn.doublesCount > 0) newState.turn.phase = 'WAITING_FOR_ROLL';
                    else nextTurn();
                    break;
                }

                case 'SKIP_BUY': {
                    // To keep it simple in this V1, skip auction and just pass turn.
                    // (Full auction state machine requires many steps).
                    if (newState.turn.doublesCount > 0) newState.turn.phase = 'WAITING_FOR_ROLL';
                    else nextTurn();
                    break;
                }

                case 'UPGRADE_PROPERTY': {
                    const { tileId } = action.payload;
                    const tile = BOARD_TILES[tileId];
                    const group = GROUPS[tile.group];
                    if (player.money >= group.upgradePrice) {
                        player.money -= group.upgradePrice;
                        newState.properties[tileId].level++;
                        logMsg(`${player.name} upgrade ${tile.name} ke level ${newState.properties[tileId].level}`);
                    }
                    break;
                }
                
                case 'PAY_JAIL': {
                    if (player.money >= 500000) {
                        player.money -= 500000;
                        player.jailStatus = false;
                        logMsg(`${player.name} bayar denda penjara Rp500.000`);
                        newState.turn.phase = 'WAITING_FOR_ROLL';
                    }
                    break;
                }

                case 'USE_CARD': {
                    if (player.cards.includes('ORANG_DALAM')) {
                        player.cards = player.cards.filter(c => c !== 'ORANG_DALAM');
                        player.jailStatus = false;
                        logMsg(`${player.name} pakai jalur ORANG DALAM keluar penjara!`);
                        newState.turn.phase = 'WAITING_FOR_ROLL';
                    }
                    break;
                }
                
                case 'BANKRUPT_DECLARE': {
                    player.bankrupt = true;
                    logMsg(`🚨 ${player.name} BANGKRUT!`);
                    
                    // Return properties to bank (simplified)
                    Object.keys(newState.properties).forEach(id => {
                        if (newState.properties[id].ownerId === player.id) {
                            newState.properties[id] = { ownerId: null, level: 0, mortgaged: false };
                        }
                    });

                    // Check win condition
                    const activePlayers = newState.turnOrder.filter(id => !newState.players[id].bankrupt);
                    if (activePlayers.length === 1) {
                        newState.status = 'game_over';
                        newState.winner = activePlayers[0];
                        logMsg(`🏆 ${newState.players[activePlayers[0]].name} MENANG!`);
                    } else {
                        nextTurn();
                    }
                    break;
                }
            }

            return newState;
        };

        const GameBoard = ({ state, me, sendAction }) => {
            const myTurn = state.turn.currentPlayerId === me.id;
            const myPlayer = state.players[me.id];

            // Render Tiles in order
            const renderTile = (idx, classNames) => {
                const tile = BOARD_TILES[idx];
                const propState = state.properties[idx];
                const owner = propState?.ownerId ? state.players[propState.ownerId] : null;

                // Players on this tile
                const playersHere = state.turnOrder.filter(pid => state.players[pid].position === idx && !state.players[pid].bankrupt);

                return (
                    <div key={idx} className={`tile ${classNames} relative group cursor-pointer`} onClick={() => console.log(tile)}>
                        {tile.group && (
                            <div className="color-header flex items-center justify-center" style={{ backgroundColor: GROUPS[tile.group].color }}>
                                {propState?.level > 0 && <span className="text-white font-bold text-[8px]">{propState.level === 4 ? '🏢' : '🏠'.repeat(propState.level)}</span>}
                            </div>
                        )}
                        <div className="flex-1 flex flex-col items-center justify-center p-1">
                            <span className="font-bold text-center leading-tight mb-1">{tile.name}</span>
                            {tile.icon && <i className={`fas ${tile.icon} text-slate-400 text-lg my-1`}></i>}
                            {tile.price && <span className="text-slate-500 font-semibold">{formatRp(tile.price).replace(',00', '')}</span>}
                            {owner && <div className="absolute bottom-0 w-full h-1" style={{backgroundColor: owner.color}}></div>}
                        </div>
                        
                        {/* Player Tokens Container */}
                        <div className="absolute top-0 left-0 w-full h-full flex flex-wrap items-center justify-center pointer-events-none p-1 gap-1">
                            {playersHere.map(pid => (
                                <div key={pid} className="player-token" style={{ backgroundColor: state.players[pid].color }}></div>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col lg:flex-row h-screen bg-slate-100 p-2 gap-4">
                    {/* Left: Board */}
                    <div className="flex-1 flex items-center justify-center overflow-auto p-4">
                        <div className="board-grid">
                            {/* Top Row (20-30) */}
                            {renderTile(20, 'col-span-1 row-span-1 rounded-tl-xl')}
                            {[21, 22, 23, 24, 25, 26, 27, 28, 29].map((i, idx) => renderTile(i, `col-start-${idx+2} row-start-1 tile-top`))}
                            {renderTile(30, 'col-start-11 row-start-1 rounded-tr-xl')}

                            {/* Right Col (31-39) */}
                            {[31, 32, 33, 34, 35, 36, 37, 38, 39].map((i, idx) => renderTile(i, `col-start-11 row-start-${idx+2} tile-right`))}

                            {/* Bottom Row (10-0 reverse) */}
                            {renderTile(10, 'col-start-1 row-start-11 rounded-bl-xl')}
                            {[9, 8, 7, 6, 5, 4, 3, 2, 1].map((i, idx) => renderTile(i, `col-start-${idx+2} row-start-11 tile-bottom`))}
                            {renderTile(0, 'col-start-11 row-start-11 rounded-br-xl')}

                            {/* Left Col (19-11 reverse) */}
                            {[19, 18, 17, 16, 15, 14, 13, 12, 11].map((i, idx) => renderTile(i, `col-start-1 row-start-${idx+2} tile-left`))}

                            {/* Center Logo & Dice */}
                            <div className="center-board">
                                <h1 className="text-4xl md:text-6xl font-black text-slate-200 rotate-[-45deg] whitespace-nowrap opacity-50 tracking-tighter">
                                    MONOPOLI WNI
                                </h1>
                                
                                <div className="absolute flex flex-col items-center justify-center z-20">
                                    {state.turn.lastDice && (
                                        <div className="flex gap-4 mb-8">
                                            {state.turn.lastDice.map((d, i) => (
                                                <div key={i} className="w-16 h-16 bg-white rounded-xl shadow-xl flex items-center justify-center text-3xl font-black text-slate-800 border-2 border-slate-200">
                                                    {d}
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {/* Action Area based on phase */}
                                    {myTurn && state.turn.phase === 'WAITING_FOR_ROLL' && (
                                        <button 
                                            onClick={() => sendAction('ROLL')}
                                            className="bg-red-600 text-white font-bold text-xl px-12 py-4 rounded-full shadow-lg hover:bg-red-700 transition transform hover:scale-105 animate-pulse"
                                        >
                                            <i className="fas fa-dice mr-2"></i> ROLL DADU
                                        </button>
                                    )}

                                    {myTurn && state.turn.phase === 'JAIL_DECISION' && (
                                        <div className="flex gap-2">
                                            <button onClick={() => sendAction('ROLL')} className="bg-slate-800 text-white px-6 py-3 rounded-xl font-bold shadow hover:bg-slate-700">Roll Double</button>
                                            <button onClick={() => sendAction('PAY_JAIL')} className="bg-red-600 text-white px-6 py-3 rounded-xl font-bold shadow hover:bg-red-700">Bayar 500k</button>
                                            {myPlayer.cards.includes('ORANG_DALAM') && (
                                                <button onClick={() => sendAction('USE_CARD')} className="bg-yellow-500 text-slate-900 px-6 py-3 rounded-xl font-bold shadow hover:bg-yellow-400">Pakai Orang Dalam</button>
                                            )}
                                        </div>
                                    )}

                                    {myTurn && state.turn.phase === 'PROPERTY_DECISION' && (
                                        <div className="glass-panel p-6 rounded-2xl flex flex-col items-center shadow-2xl">
                                            <h3 className="font-bold text-lg mb-1">{BOARD_TILES[myPlayer.position].name}</h3>
                                            <p className="text-slate-600 mb-4">{formatRp(BOARD_TILES[myPlayer.position].price)}</p>
                                            <div className="flex gap-3">
                                                <button onClick={() => sendAction('BUY_PROPERTY')} className="bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700">BELI</button>
                                                <button onClick={() => sendAction('SKIP_BUY')} className="bg-slate-200 text-slate-700 px-6 py-2 rounded-lg font-bold hover:bg-slate-300">LEWAT</button>
                                            </div>
                                        </div>
                                    )}

                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Right: Players & Logs */}
                    <div className="w-full lg:w-80 flex flex-col gap-4">
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 flex-1 overflow-auto">
                            <h3 className="font-bold text-slate-800 uppercase text-xs tracking-wider mb-3">Pemain</h3>
                            <div className="space-y-3">
                                {state.turnOrder.map(pid => {
                                    const p = state.players[pid];
                                    const isActive = state.turn.currentPlayerId === pid;
                                    return (
                                        <div key={pid} className={`p-3 rounded-xl border-2 transition ${isActive ? 'border-red-500 bg-red-50' : 'border-transparent bg-slate-50'}`}>
                                            <div className="flex justify-between items-center mb-1">
                                                <div className="flex items-center gap-2">
                                                    <div className="w-4 h-4 rounded-full" style={{ backgroundColor: p.color }}></div>
                                                    <span className={`font-bold ${p.bankrupt ? 'line-through text-slate-400' : 'text-slate-800'}`}>{p.name}</span>
                                                </div>
                                                {p.jailStatus && <i className="fas fa-border-all text-slate-400"></i>}
                                            </div>
                                            <div className="text-sm font-semibold text-green-600">{formatRp(p.money)}</div>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* Actions for current player (Upgrade etc) */}
                            {myTurn && (
                                <div className="mt-6 border-t pt-4">
                                    <h4 className="font-bold text-xs text-slate-500 mb-2">TINDAKAN</h4>
                                    <button onClick={() => {
                                        if(window.confirm("Lu nyerah dan bangkrut?")) sendAction('BANKRUPT_DECLARE')
                                    }} className="text-red-500 text-sm font-bold w-full text-left py-2 hover:bg-red-50 px-2 rounded">
                                        <i className="fas fa-flag mr-2"></i> Nyatakan Bangkrut
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* Logs */}
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 h-64 flex flex-col">
                            <h3 className="font-bold text-slate-800 uppercase text-xs tracking-wider mb-3">Aktivitas</h3>
                            <div className="flex-1 overflow-auto text-sm space-y-2 flex flex-col-reverse">
                                {/* Using reverse map would be better but we rely on simple state for this demo */}
                                {state.logs && state.logs.map((l, i) => (
                                    <div key={i} className="text-slate-600 border-b border-slate-50 pb-1 last:border-0">{l}</div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };


        const App = () => {
            const [playerId, setPlayerId] = useLocalStorage('wni_player_id', generateId());
            const [roomCode, setRoomCode] = useState(null);
            const [room, setRoom] = useState(null);
            const [players, setPlayers] = useState([]);
            const [dbSetupNeeded, setDbSetupNeeded] = useState(false);
            
            // Subscriptions ref
            const subs = useRef([]);

            // Check DB Setup
            useEffect(() => {
                const checkDb = async () => {
                    const { error } = await supabase.from('wni_rooms').select('id').limit(1);
                    if (error && error.code === '42P01') { // Relation does not exist
                        setDbSetupNeeded(true);
                    }
                };
                checkDb();
            }, []);

            // Subscribe to room updates
            useEffect(() => {
                if (!roomCode) return;

                const fetchInitial = async () => {
                    const { data: rm } = await supabase.from('wni_rooms').select('*').eq('code', roomCode).single();
                    if (rm) setRoom(rm);
                    const { data: pls } = await supabase.from('wni_players').select('*').eq('room_id', rm.id);
                    if (pls) setPlayers(pls);
                };
                fetchInitial();

                const roomSub = supabase.channel(`room_${roomCode}`)
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'wni_rooms', filter: `code=eq.${roomCode}` }, payload => {
                        setRoom(payload.new);
                    }).subscribe();
                
                const playersSub = supabase.channel(`players_${roomCode}`)
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'wni_players' }, payload => {
                        // In a real app we'd filter by room_id in the subscription, but RLS or client filter is fine for this demo
                        setPlayers(prev => {
                            const exists = prev.find(p => p.id === payload.new.id);
                            if (payload.eventType === 'DELETE') return prev.filter(p => p.id !== payload.old.id);
                            if (exists) return prev.map(p => p.id === payload.new.id ? payload.new : p);
                            return [...prev, payload.new];
                        });
                    }).subscribe();

                subs.current = [roomSub, playersSub];

                return () => {
                    subs.current.forEach(s => supabase.removeChannel(s));
                };
            }, [roomCode]);

            // Host Engine Loop (Only runs if current player is host and game is active)
            useEffect(() => {
                if (!room || room.status !== 'playing' || room.host_id !== playerId) return;

                const actionsSub = supabase.channel(`actions_${room.id}`)
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'wni_actions', filter: `room_id=eq.${room.id}` }, async payload => {
                        const action = payload.new;
                        
                        // Process action to get new state
                        let logQueue = [];
                        const logMsg = (msg) => logQueue.push(`[${new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}] ${msg}`);
                        
                        const newState = processAction(room.state, action, logMsg);
                        
                        // Prepend new logs (keep last 50)
                        newState.logs = [...logQueue, ...(newState.logs || [])].slice(0, 50);

                        // Update Database state
                        await supabase.from('wni_rooms').update({ state: newState }).eq('id', room.id);
                        
                        // If game over
                        if (newState.status === 'game_over') {
                            await supabase.from('wni_rooms').update({ status: 'finished' }).eq('id', room.id);
                        }
                    }).subscribe();

                return () => supabase.removeChannel(actionsSub);
            }, [room, playerId]);

            const handleCreateRoom = async (name) => {
                const code = Math.random().toString(36).substring(2, 6).toUpperCase();
                const { data: newRoom, error: roomErr } = await supabase.from('wni_rooms').insert([
                    { code, host_id: playerId }
                ]).select().single();

                if (roomErr) return alert('Gagal membuat room. Cek console.');

                await supabase.from('wni_players').insert([
                    { id: playerId, room_id: newRoom.id, name, color: COLORS[0], is_ready: true }
                ]);
                
                setRoomCode(code);
            };

            const handleJoinRoom = async (code, name) => {
                const { data: rm, error } = await supabase.from('wni_rooms').select('*').eq('code', code).single();
                if (error || !rm) return alert('Room tidak ditemukan!');
                if (rm.status !== 'waiting') return alert('Game sudah dimulai!');

                const { data: existingPlayers } = await supabase.from('wni_players').select('*').eq('room_id', rm.id);
                if (existingPlayers.length >= 8) return alert('Room penuh!');
                
                const existingMe = existingPlayers.find(p => p.id === playerId);
                if (!existingMe) {
                    await supabase.from('wni_players').insert([
                        { id: playerId, room_id: rm.id, name, color: COLORS[existingPlayers.length % COLORS.length] }
                    ]);
                }
                setRoomCode(code);
            };

            const handleReady = async (isReady) => {
                // Optimistic UI Update agar tombol merespon instan
                setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, is_ready: isReady } : p));
                
                const { error } = await supabase.from('wni_players').update({ is_ready: isReady }).eq('id', playerId);
                if (error) {
                    console.error("Gagal update status ready:", error);
                    // Rollback jika gagal
                    setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, is_ready: !isReady } : p));
                }
            };

            const handleStartGame = async () => {
                // Initialize Game State
                const turnOrder = players.map(p => p.id).sort(() => Math.random() - 0.5); // Shuffle
                
                const initialState = {
                    status: 'playing',
                    turnOrder,
                    turn: {
                        currentIndex: 0,
                        currentPlayerId: turnOrder[0],
                        phase: 'WAITING_FOR_ROLL', // WAITING_FOR_ROLL, ANIMATING, PROPERTY_DECISION, JAIL_DECISION
                        doublesCount: 0,
                        lastDice: null
                    },
                    players: {},
                    properties: {},
                    logs: ['Game dimulai!']
                };

                players.forEach(p => {
                    initialState.players[p.id] = {
                        id: p.id,
                        name: p.name,
                        color: p.color,
                        money: 15000000,
                        position: 0,
                        jailStatus: false,
                        jailAttempts: 0,
                        bankrupt: false,
                        cards: []
                    };
                });

                BOARD_TILES.forEach(t => {
                    if (['PROPERTY', 'TRANSPORT', 'UTILITY'].includes(t.type)) {
                        initialState.properties[t.id] = { ownerId: null, level: 0, mortgaged: false };
                    }
                });

                await supabase.from('wni_rooms').update({ 
                    status: 'playing', 
                    state: initialState 
                }).eq('id', room.id);
            };

            const sendAction = async (type, payload = {}) => {
                await supabase.from('wni_actions').insert([{
                    room_id: room.id,
                    player_id: playerId,
                    type,
                    payload
                }]);
            };

            const handleLeave = () => {
                supabase.from('wni_players').delete().eq('id', playerId).then(() => {
                    setRoomCode(null);
                    setRoom(null);
                    setPlayers([]);
                });
            };

            if (dbSetupNeeded) return <SetupScreen onComplete={() => { setDbSetupNeeded(false); window.location.reload(); }} />;

            if (!roomCode || !room) {
                return <Home onJoin={handleJoinRoom} onCreate={handleCreateRoom} />;
            }

            const me = players.find(p => p.id === playerId);
            if (!me) return <div className="p-8 text-center text-slate-500">Menghubungkan...</div>;

            if (room.status === 'waiting') {
                return <Lobby room={room} players={players} me={me} onReady={handleReady} onStart={handleStartGame} onLeave={handleLeave} />;
            }
            
            if (room.status === 'finished') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900">
                        <div className="bg-white p-8 rounded-2xl text-center shadow-2xl max-w-md w-full">
                            <h1 className="text-4xl font-black text-slate-800 mb-2">GAME OVER</h1>
                            <p className="text-xl mb-6 text-slate-600">Pemenang: <span className="font-bold text-red-600">{room.state.players[room.state.winner]?.name}</span></p>
                            <button onClick={handleLeave} className="w-full bg-slate-900 text-white py-3 rounded-lg font-bold">KEMBALI KE MENU</button>
                        </div>
                    </div>
                );
            }

            return <GameBoard state={room.state} me={me} sendAction={sendAction} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
