        * {

        body {

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }

        /* Board Container Responsive Geometry */
        .board-wrapper {
            width: min(98vw, calc(100vh - 210px), 760px);
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            position: relative;
        }

        /* Continuous Perimeter 8x8 Grid Layout */
        .board-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            background: #1e293b;
            border: 3px solid #334155;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 35px rgba(239, 68, 68, 0.15);
            position: relative;
        }

        /* Individual Tile Component */
        .tile {
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            position: relative;
            padding: 2px 1px;
            overflow: hidden;
            user-select: none;
        }

        .tile-landed {
            animation: tilePulse 0.8s ease-in-out infinite alternate;
            z-index: 15;
            box-shadow: inset 0 0 0 3px #ef4444;
        }

        @keyframes tilePulse {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.25); box-shadow: inset 0 0 12px rgba(239, 68, 68, 0.5); }
        }

        /* Tile Header Color Strip */
        .tile .color-header {
            width: 100%;
            height: 18%;
            min-height: 8px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
        }

        /* Content Wrapper for Uniform Upright Alignment */
        .tile-content-wrapper {
             display: flex;
             flex-direction: column;
             align-items: center;
             justify-content: space-between;
             height: 100%;
             width: 100%;
             padding: 1px 0;
        }

        /* STRICT SINGLE LINE TILE TITLE - NEVER TRUNCATED OR WRAPPED */
        .tile-title {
            font-size: clamp(6px, 1.25vw, 10px);
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.02em;
            white-space: nowrap !important;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
            padding: 0 1px;
            color: #0f172a;
        }

        .tile-price {
            font-size: clamp(5.5px, 1.1vw, 9px);
            font-weight: 800;
            line-height: 1;
            color: #475569;
            margin-top: auto;
            margin-bottom: 1px;
            white-space: nowrap;
        }

        /* Center Board Decorative Area */
        .center-board {
            grid-column: 2 / 8;
            grid-row: 2 / 8;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 8px;
            position: relative;
            overflow: hidden;
        }

        /* Player Tokens */
        .player-token {
            width: clamp(12px, 2.2vw, 18px);
            height: clamp(12px, 2.2vw, 18px);
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 3px 8px rgba(0,0,0,0.7);
            position: absolute;
            transition: all 0.18s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 25;
        }

        .token-stepping {
            transform: scale(1.4) translateY(-6px);
            z-index: 35 !important;
        }

        /* Rolling Dice Shake Effect */
        @keyframes diceShake {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-12deg) scale(1.1); }
            75% { transform: rotate(12deg) scale(1.1); }
        }
        .dice-rolling { animation: diceShake 0.2s infinite ease-in-out; }

        /* Authentic Dot Dice Styling */
        .dice-box {
            width: clamp(42px, 8vw, 56px);
            height: clamp(42px, 8vw, 56px);
            background: #ffffff;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4), inset 0 -3px 0 rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            gap: 2px;

        }

            100% { opacity: 0; transform: translateY(-35px) scale(0.9); }
        }

        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = localStorage.getItem('wni_muted') === 'true';
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
            }

            setMuted(mute) {
                this.muted = mute;
                localStorage.setItem('wni_muted', mute ? 'true' : 'false');
            }

            playDice() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180 + Math.random() * 150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.07);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.07);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.07);
            }

            playStep() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.06);
            }

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.22);
            }

                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.08);
                    osc.stop(this.ctx.currentTime + idx * 0.08 + 0.18);
                });
            }

        const useLocalStorage = (key, initialValue) => {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    return initialValue;
                }
            });
            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));

            return [storedValue, setValue];

        const AnimatedMoney = ({ amount }) => {
            const [display, setDisplay] = useState(amount);
            const prevAmountRef = useRef(amount);
            const [delta, setDelta] = useState(null);

            useEffect(() => {
                const diff = amount - prevAmountRef.current;
                if (diff !== 0) {
                    setDelta(diff);
                    if (diff > 0) audioFX.playMoney();
                    const timer = setTimeout(() => setDelta(null), 1800);

                    const start = display;
                    const duration = 400;
                    const startTime = performance.now();

                    const step = (now) => {
                        const elapsed = now - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        setDisplay(Math.round(start + (amount - start) * progress));
                        if (progress < 1) requestAnimationFrame(step);
                    };
                    requestAnimationFrame(step);

                    prevAmountRef.current = amount;
                    return () => clearTimeout(timer);

                            <div className="flex items-center my-4">
                                <div className="flex-grow border-t border-slate-800"></div>
                                <span className="px-4 text-slate-500 text-xs font-extrabold uppercase tracking-widest">ATAU</span>
                                <div className="flex-grow border-t border-slate-800"></div>
                            </div>

                            <div className="flex gap-2">
                                <input 
                                    type="text" 
                                    value={code} 
                                    onChange={(e) => setCode(e.target.value.toUpperCase())}
                                    className="w-full bg-slate-800/80 border border-slate-700/80 text-white rounded-xl px-4 py-3.5 focus:outline-none focus:border-red-500 uppercase font-black tracking-widest transition placeholder-slate-500"
                                    placeholder="KODE ROOM"
                                />
                                <button onClick={handleJoin} className="bg-slate-800 text-slate-200 border border-slate-700 hover:bg-slate-700 font-bold px-6 rounded-xl transition active:scale-[0.98] whitespace-nowrap">
                                    GABUNG
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Lobby = ({ room, players, me, onReady, onStart, onLeave }) => {
            const isHost = room.host_id === me.id;
            const allReady = players.every(p => p.is_ready);

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-slate-950">
                    <div className="max-w-xl w-full bg-slate-900 rounded-3xl shadow-2xl border border-slate-800 overflow-hidden">
                        <div className="bg-slate-800/80 p-6 flex justify-between items-center border-b border-slate-700/50">
                            <div>
                                <p className="text-xs text-slate-400 uppercase tracking-widest font-extrabold">Kode Room</p>
                                <h2 className="text-3xl font-black tracking-widest text-white">{room.code}</h2>
                            </div>
                            <button onClick={onLeave} className="text-slate-400 hover:text-rose-400 transition p-2"><i className="fas fa-sign-out-alt text-xl"></i></button>
                        </div>
                        
                        <div className="p-6">
                            <div className="flex items-center justify-between mb-4">
                                <span className="font-extrabold text-slate-300 text-sm tracking-wider uppercase">Pemain ({players.length}/8)</span>
                                {players.length < 2 && <span className="text-rose-400 text-xs font-bold bg-rose-500/10 px-3 py-1 rounded-full border border-rose-500/20">Butuh min. 2 pemain</span>}
                            </div>
                            
                            <div className="grid gap-3 mb-6 max-h-72 overflow-y-auto pr-1">
                                {players.map(p => (
                                    <div key={p.id} className="flex items-center justify-between p-3.5 bg-slate-800/50 rounded-2xl border border-slate-700/40">
                                        <div className="flex items-center gap-3">
                                            <div className="w-8 h-8 rounded-full shadow-md border-2 border-white/20" style={{ backgroundColor: p.color }}></div>
                                            <span className="font-bold text-slate-200">
                                                {p.name} {p.id === room.host_id && <i className="fas fa-crown text-amber-400 ml-1.5" title="Host"></i>}
                                                {p.id === me.id && <span className="text-xs text-slate-400 font-semibold ml-2">(Kamu)</span>}
                                            </span>
                                        </div>
                                        <div>
                                            {p.is_ready 
                                                ? <span className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1.5 rounded-full font-black tracking-wider">READY</span>
                                                : <span className="bg-slate-700/50 text-slate-400 border border-slate-600/30 text-xs px-3 py-1.5 rounded-full font-black tracking-wider">WAITING</span>
                                            }
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="flex gap-3">
                                <button 
                                    onClick={() => onReady(!me.is_ready)}
                                    className={`flex-1 py-4 rounded-xl font-black tracking-wider transition active:scale-[0.98] ${me.is_ready ? 'bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700' : 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/20 hover:bg-emerald-500'}`}
                                >
                                    {me.is_ready ? 'BATAL READY' : 'SAYA READY'}
                                </button>
                                
                                {isHost && (
                                    <button 
                                        onClick={onStart}
                                        disabled={!allReady || players.length < 2}
                                        className={`flex-1 py-4 rounded-xl font-black tracking-wider transition active:scale-[0.98] ${allReady && players.length >= 2 ? 'bg-gradient-to-r from-red-600 to-rose-600 text-white shadow-lg shadow-red-600/25 hover:from-red-500 hover:to-rose-500' : 'bg-slate-800 text-slate-600 cursor-not-allowed border border-slate-800'}`}
                                    >
                                        MULAI GAME
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const processAction = (state, action, logMsg) => {
            const newState = JSON.parse(JSON.stringify(state));
            const player = newState.players[action.player_id];
            
            if (!player) return newState;

            const nextTurn = () => {
                newState.turn.doublesCount = 0;
                let nextIdx = (newState.turn.currentIndex + 1) % newState.turnOrder.length;
                
                let iterations = 0;
                while(newState.players[newState.turnOrder[nextIdx]].bankrupt && iterations < newState.turnOrder.length) {
                    nextIdx = (nextIdx + 1) % newState.turnOrder.length;
                    iterations++;
                }
                
                newState.turn.currentIndex = nextIdx;
                newState.turn.currentPlayerId = newState.turnOrder[nextIdx];
                newState.turn.phase = 'WAITING_FOR_ROLL';
                
                const nextPlayer = newState.players[newState.turn.currentPlayerId];
                if (nextPlayer.jailStatus) {
                    newState.turn.phase = 'JAIL_DECISION';
                }
            };

            const checkBankrupt = (playerId) => {
                if (newState.players[playerId].money < 0) {
                    player.bankrupt = true;
                    logMsg(`💥 ${player.name} BANGKRUT!`);
                    Object.keys(newState.properties).forEach(id => {
                        if (newState.properties[id].ownerId === player.id) {
                            newState.properties[id] = { ownerId: null, level: 0, mortgaged: false };
                        }
                    });
                    const activePlayers = newState.turnOrder.filter(id => !newState.players[id].bankrupt);
                    if (activePlayers.length === 1) {
                        newState.status = 'game_over';
                        newState.winner = activePlayers[0];
                        logMsg(`🏆 ${newState.players[activePlayers[0]].name} MENANG!`);
                    } else {
                        nextTurn();
                    }
                    return true;
                }
                return false;
            };

            switch (action.type) {
                case 'ROLL': {
                    if (newState.turn.phase !== 'WAITING_FOR_ROLL' && newState.turn.phase !== 'JAIL_DECISION') break;
                    
                    const d1 = action.payload?.d1 || (Math.floor(Math.random() * 6) + 1);
                    const d2 = action.payload?.d2 || (Math.floor(Math.random() * 6) + 1);
                    const isDouble = d1 === d2;
                    newState.turn.lastDice = [d1, d2];
                    
                    logMsg(`${player.name} melempar dadu: ${d1} & ${d2} ${isDouble ? '(Double!)' : ''}`);

                    if (player.jailStatus) {
                        if (isDouble) {
                            player.jailStatus = false;
                            player.jailAttempts = 0;
                            logMsg(`${player.name} keluar penjara (Double)!`);
                        } else {
                            player.jailAttempts = (player.jailAttempts || 0) + 1;
                            if (player.jailAttempts >= 3) {
                                logMsg(`${player.name} gagal double 3x. Bayar denda Rp500rb.`);
                                player.money -= 500000;
                                player.jailStatus = false;
                                player.jailAttempts = 0;
                            } else {
                                logMsg(`${player.name} tetap di penjara.`);
                                nextTurn();
                                break;
                            }
                        }
                    }

                    if (isDouble && !player.jailStatus) {
                        newState.turn.doublesCount = (newState.turn.doublesCount || 0) + 1;
                        if (newState.turn.doublesCount === 3) {
                            logMsg(`${player.name} kena tilang ngebut (Double 3x). Masuk Penjara!`);
                            player.jailStatus = true;
                            newState.turn.targetPosition = 7;
                            newState.turn.phase = 'ANIMATING_MOVE';
                            break;
                        }
                    } else {
                        newState.turn.doublesCount = 0;
                    }

                    // STRICT CALCULATED MOVE DESTINATION
                    const startPos = player.position;
                    const steps = d1 + d2;
                    const targetPos = (startPos + steps) % 28;
                    
                    newState.turn.targetPosition = targetPos;
                    newState.turn.phase = 'ANIMATING_MOVE';
                    break;
                }

                case 'TOKEN_ARRIVED': {
                    if (newState.turn.phase !== 'ANIMATING_MOVE' || newState.turn.currentPlayerId !== action.player_id) break;
                    
                    const oldPos = player.position;
                    player.position = newState.turn.targetPosition;
                    
                    // Check pass GO (Gajian)
                    if (player.position < oldPos && player.position !== 7 && !player.jailStatus) {
                        player.money += 2000000;
                        logMsg(`${player.name} melewati GAJIAN, dapat Rp2.000.000`);
                    }

                    const tile = BOARD_TILES[player.position];
                    
                    if (tile.type === 'PROPERTY' || tile.type === 'TRANSPORT') {
                        const propState = newState.properties[tile.id];
                        if (!propState.ownerId) {
                            newState.turn.phase = 'PROPERTY_DECISION';
                        } else if (propState.ownerId !== player.id && !propState.mortgaged) {
                            // Rent Logic
                            let rent = 0;
                            const owner = propState.ownerId;
                            if (tile.type === 'PROPERTY') {
                                rent = tile.rent[propState.level];
                                if (propState.level === 0) {
                                    const groupTiles = BOARD_TILES.filter(t => t.group === tile.group).map(t => t.id);
                                    const ownsAll = groupTiles.every(tid => newState.properties[tid].ownerId === owner);
                                    if (ownsAll) rent *= 2;
                                }
                            } else if (tile.type === 'TRANSPORT') {
                                const transCount = BOARD_TILES.filter(t => t.type === 'TRANSPORT').filter(t => newState.properties[t.id].ownerId === owner).length;
                                rent = 250000 * Math.pow(2, transCount - 1);
                            }
                            
                            logMsg(`${player.name} bayar sewa Rp${rent.toLocaleString('id-ID')} ke ${newState.players[owner].name}`);
                            player.money -= rent;
                            newState.players[owner].money += rent;
                            
                            if (checkBankrupt(player.id)) break;
                            
                            if (newState.turn.doublesCount > 0) newState.turn.phase = 'WAITING_FOR_ROLL';
                            else nextTurn();
                        } else {
                            if (newState.turn.doublesCount > 0) newState.turn.phase = 'WAITING_FOR_ROLL';
                            else nextTurn();
                        }
                    } else if (tile.type === 'GO_TO_JAIL') {
                        logMsg(`${player.name} DITANGKAP POLISI! Masuk Penjara.`);
                        player.position = 7;
                        player.jailStatus = true;
                        newState.turn.doublesCount = 0;
                        nextTurn();
                    } else if (tile.type === 'CHANCE' || tile.type === 'COMMUNITY') {
                        const cardArr = tile.type === 'CHANCE' ? NASIB_CARDS : REALITA_CARDS;
                        const card = cardArr[Math.floor(Math.random() * cardArr.length)];
                        newState.turn.activeCard = { ...card, cardType: tile.type };
                        newState.turn.phase = 'CARD_POPUP';
                        logMsg(`${player.name} dapat kartu: ${card.text}`);
                    } else {
                        // GO or FREE PARKING or VISITING JAIL
                        if (newState.turn.doublesCount > 0) newState.turn.phase = 'WAITING_FOR_ROLL';
                        else nextTurn();
                    }
                    break;
                }

                case 'BUY_PROPERTY': {
                    const tile = BOARD_TILES[player.position];
                    if (player.money < tile.price) break;
                    
                    player.money -= tile.price;
                    newState.properties[tile.id].ownerId = player.id;
                    logMsg(`${player.name} membeli ${tile.name}`);
                    
                    if (newState.turn.doublesCount > 0) newState.turn.phase = 'WAITING_FOR_ROLL';
                    else nextTurn();
                    break;
                }

                case 'SKIP_BUY': {
                    if (newState.turn.doublesCount > 0) newState.turn.phase = 'WAITING_FOR_ROLL';
                    else nextTurn();
                    break;
                }

                case 'CLOSE_CARD_POPUP': {
                    const card = newState.turn.activeCard;
                    delete newState.turn.activeCard;

                    if (!card) {
                        if (newState.turn.doublesCount > 0) newState.turn.phase = 'WAITING_FOR_ROLL';
                        else nextTurn();
                        break;
                    }

                    if (card.action === 'money') {
                        player.money += card.amount;
                        if (checkBankrupt(player.id)) break;
                    } else if (card.action === 'jail') {
                        player.jailStatus = true;
                        player.position = 7;
                        newState.turn.doublesCount = 0;
                        nextTurn();
                        break;
                    } else if (card.action === 'keep_jail_card') {
                        player.cards = player.cards || [];
                        player.cards.push('ORANG_DALAM');
                    }

                    if (newState.turn.doublesCount > 0 && !player.jailStatus) newState.turn.phase = 'WAITING_FOR_ROLL';
                    else nextTurn();
                    break;
                }

                case 'UPGRADE_PROPERTY': {
                    const { tileId } = action.payload;
                    const tile = BOARD_TILES[tileId];
                    const group = GROUPS[tile.group];
                    const prop = newState.properties[tileId];

                    if (prop.ownerId === player.id && prop.level < 4 && player.money >= group.upgradePrice) {
                        player.money -= group.upgradePrice;
                        prop.level++;
                        logMsg(`${player.name} meningkatkan ${tile.name} ke level ${BUILDING_NAMES[prop.level]}`);
                    }
                    break;
                }
                
                case 'PAY_JAIL': {
                    if (player.money >= 500000) {
                        player.money -= 500000;
                        player.jailStatus = false;
                        logMsg(`${player.name} bayar denda penjara Rp500rb`);
                        newState.turn.phase = 'WAITING_FOR_ROLL';
                    }
                    break;
                }

                case 'USE_CARD': {
                    if (player.cards && player.cards.includes('ORANG_DALAM')) {
                        player.cards = player.cards.filter(c => c !== 'ORANG_DALAM');
                        player.jailStatus = false;
                        logMsg(`${player.name} pakai kartu ORANG DALAM!`);
                        newState.turn.phase = 'WAITING_FOR_ROLL';
                    }
                    break;
                }
                
                case 'BANKRUPT_DECLARE': {
                    checkBankrupt(player.id);
                    break;
                }
            }

            return newState;
        };

        const GameBoard = ({ state, me, sendAction }) => {
            const myTurn = state.turn.currentPlayerId === me.id;
            const myPlayer = state.players[me.id];
            
            const [rolling, setRolling] = useState(false);
            const [displayDice, setDisplayDice] = useState([1, 1]);
            const [visualPositions, setVisualPositions] = useState({});
            const [isLocalAnimating, setIsLocalAnimating] = useState(false);
            const [passGoToast, setPassGoToast] = useState(false);
            const [activeTab, setActiveTab] = useState('board');
            const [muted, setMuted] = useState(audioFX.muted);

            // Sync visual positions & animate movement strictly step-by-step
            useEffect(() => {
                if (!state?.players) return;
                
                // Initialize positions on load
                if (Object.keys(visualPositions).length === 0) {
                    const initVisuals = {};
                    Object.keys(state.players).forEach(pid => {
                        initVisuals[pid] = state.players[pid].position;
                    });
                    setVisualPositions(initVisuals);
                    return;
                }

                const activePlayerId = state.turn.currentPlayerId;
                const currentVisual = visualPositions[activePlayerId] !== undefined 
                    ? visualPositions[activePlayerId] 
                    : state.players[activePlayerId]?.position;

                if (state.turn.phase === 'ANIMATING_MOVE' && !isLocalAnimating && currentVisual !== undefined) {
                    const targetPos = state.turn.targetPosition;
                    
                    if (currentVisual !== targetPos) {
                        runStepByStepAnimation(activePlayerId, currentVisual, targetPos);
                    } else {
                        // Position already matches target
                        if (myTurn) {
                            sendAction('TOKEN_ARRIVED');
                        }
                    }
                }
            }, [state?.turn?.phase, state?.turn?.targetPosition, state?.turn?.currentPlayerId]);

            const runStepByStepAnimation = (pid, start, end) => {
                setIsLocalAnimating(true);
                let current = start;

                const stepInterval = setInterval(() => {
                    current = (current + 1) % 28;
                    audioFX.playStep();
                    
                    if (current === 0) {
                        setPassGoToast(true);
                        setTimeout(() => setPassGoToast(false), 1800);
                    }

                    setVisualPositions(prev => ({ ...prev, [pid]: current }));

                    if (current === end) {
                        clearInterval(stepInterval);
                        audioFX.playLand();
                        
                        setTimeout(() => {
                            setIsLocalAnimating(false);
                            if (pid === me.id) {
                                sendAction('TOKEN_ARRIVED');
                            }
                        }, 250);
                    }
                }, 200); // Smooth 200ms step duration
            };

            const handleRollClick = () => {
                if (!myTurn || rolling || isLocalAnimating || (state.turn.phase !== 'WAITING_FOR_ROLL' && state.turn.phase !== 'JAIL_DECISION')) return;
                
                setRolling(true);
                audioFX.playDice();

                let rolls = 0;
                const finalD1 = Math.floor(Math.random() * 6) + 1;
                const finalD2 = Math.floor(Math.random() * 6) + 1;

                const interval = setInterval(() => {
                    setDisplayDice([
                        Math.floor(Math.random() * 6) + 1,
                        Math.floor(Math.random() * 6) + 1
                    ]);
                    audioFX.playDice();
                    rolls++;

                    if (rolls > 8) {
                        clearInterval(interval);
                        setDisplayDice([finalD1, finalD2]);
                        setRolling(false);
                        sendAction('ROLL', { d1: finalD1, d2: finalD2 });
                    }
                }, 90);
            };

            const toggleMute = () => {
                const nextMute = !muted;
                setMuted(nextMute);
                audioFX.setMuted(nextMute);
            };

            const renderTile = (idx, classNames) => {
                const tile = BOARD_TILES[idx];
                const propState = state.properties[idx];
                const owner = propState?.ownerId ? state.players[propState.ownerId] : null;
                
                const playersHere = state.turnOrder.filter(pid => {
                    const pos = visualPositions[pid] !== undefined ? visualPositions[pid] : state.players[pid].position;
                    return pos === idx && !state.players[pid].bankrupt;
                });

                const isLanded = playersHere.some(pid => pid === state.turn.currentPlayerId && !isLocalAnimating && state.turn.phase !== 'ANIMATING_MOVE');

                return (
                    <div key={idx} className={`tile ${classNames} ${isLanded ? 'tile-landed' : ''}`}>
                        
                        {tile.group && (
                            <div className="color-header" style={{ backgroundColor: GROUPS[tile.group].color }}>
                                {propState?.level > 0 && (
                                    <span className="text-white text-[8px] font-black drop-shadow">
                                        {propState.level === 4 ? '🏬' : '🏠'.repeat(propState.level)}
                                    </span>
                                )}
                            </div>
                        )}
                        
                        <div className="tile-content-wrapper">
                            <span className="tile-title" title={tile.name}>
                                {tile.name}
                            </span>
                            
                            {tile.icon && <i className={`fas ${tile.icon} text-slate-500 text-[10px] sm:text-xs my-0.5`}></i>}
                            
                            {tile.price && (
                                <span className="tile-price">
                                    {formatRp(tile.price).replace(',00', '').replace('Rp', '')}
                                </span>
                            )}
                        </div>

                        {owner && (
                            <div className="absolute bottom-0 left-0 w-full h-1 md:h-1.5" style={{ backgroundColor: owner.color }} title={`Milik ${owner.name}`}></div>
                        )}
                        
                        <div className="absolute inset-0 flex flex-wrap items-center justify-center p-0.5 pointer-events-none gap-0.5 z-20">
                            {playersHere.map((pid, pIdx) => (
                                <div 
                                    key={pid} 
                                    className={`player-token ${isLocalAnimating && state.turn.currentPlayerId === pid ? 'token-stepping' : ''}`} 
                                    style={{ 
                                        backgroundColor: state.players[pid].color,
                                        transform: `translate(${(pIdx % 2) * 2}px, ${Math.floor(pIdx / 2) * 2}px)`
                                    }}
                                    title={state.players[pid].name}
                                ></div>
                            ))}
                        </div>
                    </div>
                );
            };

            const activeTile = BOARD_TILES[myPlayer.position];
            const canAffordProperty = activeTile?.price ? myPlayer.money >= activeTile.price : false;

            // Strict modal gate: Do not show popups while token is animated or moving
            const showPropertyModal = myTurn && !isLocalAnimating && state.turn.phase === 'PROPERTY_DECISION';
            const showCardModal = !isLocalAnimating && state.turn.phase === 'CARD_POPUP' && state.turn.activeCard;
            const showJailModal = myTurn && !isLocalAnimating && state.turn.phase === 'JAIL_DECISION';

            return (
                <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
                    {/* Top Bar */}
                    <div className="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between sticky top-0 z-40">
                        <div className="flex items-center gap-3">
                            <h1 className="text-lg md:text-xl font-black tracking-tight text-white">MONOPOLI<span className="text-red-500">WNI</span></h1>
                            <span className="bg-slate-800 text-slate-400 text-xs px-2.5 py-1 rounded-full border border-slate-700 font-mono font-bold">{state.code || 'GAME'}</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={toggleMute} className="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition">
                                <i className={`fas ${muted ? 'fa-volume-mute text-rose-400' : 'fa-volume-high text-emerald-400'}`}></i>
                            </button>
                        </div>
                    </div>

                    {/* Turn Status Indicator */}
                    <div className="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 py-2 px-4 border-b border-slate-800 flex items-center justify-between">
                        <div className="flex items-center gap-2.5">
                            <div className="w-3 h-3 rounded-full animate-ping" style={{ backgroundColor: state.players[state.turn.currentPlayerId]?.color }}></div>
                            <span className="text-xs font-black uppercase tracking-wider text-slate-300">
                                {myTurn ? '🎲 GILIRAN KAMU!' : `Giliran: ${state.players[state.turn.currentPlayerId]?.name}`}
                            </span>
                        </div>
                        <div className="text-xs font-bold text-slate-400">
                            Saldo: <AnimatedMoney amount={myPlayer.money} />
                        </div>
                    </div>

                    {passGoToast && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-emerald-500 text-white font-black px-6 py-3 rounded-2xl shadow-2xl border border-emerald-400 animate-bounce flex items-center gap-2">
                            <i className="fas fa-coins text-yellow-300 text-xl"></i> LEWAT GAJIAN +Rp2 Juta!
                        </div>
                    )}

                    {/* Main Workspace */}
                    <div className="flex-1 flex flex-col lg:flex-row p-2 md:p-4 gap-4 max-w-7xl mx-auto w-full items-center lg:items-start">
                        
                        {/* Board View */}
                        <div className="w-full lg:flex-1 flex justify-center items-center">
                            <div className="board-wrapper">
                                <div className="board-grid">
                                    {/* Top Row (14 to 21) */}
                                    {renderTile(14, 'col-start-1 row-start-1 rounded-tl-xl')}
                                    {[15, 16, 17, 18, 19, 20].map((i, idx) => renderTile(i, `col-start-${idx+2} row-start-1`))}
                                    {renderTile(21, 'col-start-8 row-start-1 rounded-tr-xl')}

                                    {/* Right Col (22 to 27) */}
                                    {[22, 23, 24, 25, 26, 27].map((i, idx) => renderTile(i, `col-start-8 row-start-${idx+2}`))}

                                    {/* Bottom Row (7 to 0) -> 7 is Bottom-Left, 0 is Bottom-Right */}
                                    {renderTile(7, 'col-start-1 row-start-8 rounded-bl-xl')}
                                    {[6, 5, 4, 3, 2, 1].map((i, idx) => renderTile(i, `col-start-${7-idx} row-start-8`))}
                                    {renderTile(0, 'col-start-8 row-start-8 rounded-br-xl')}

                                    {/* Left Col (13 to 8) -> 13 is just under 14 */}
                                    {[13, 12, 11, 10, 9, 8].map((i, idx) => renderTile(i, `col-start-1 row-start-${idx+2}`))}

                                    {/* Center Controls & Dice */}
                                    <div className="center-board">
                                        <h1 className="text-2xl md:text-4xl font-black text-slate-800/40 select-none rotate-[-45deg] whitespace-nowrap tracking-tighter opacity-50">
                                            MONOPOLI WNI
                                        </h1>
                                        
                                        <div className="absolute inset-0 flex flex-col items-center justify-center p-4 z-20">
                                            {/* Authentic Dot Dice */}
                                            <div className="flex gap-3 mb-4">
                                                {(rolling ? displayDice : (state.turn.lastDice || [1, 1])).map((d, i) => (
                                                    <DotDice key={i} value={d} rolling={rolling} />
                                                ))}
                                            </div>

                                            {myTurn && !isLocalAnimating && (state.turn.phase === 'WAITING_FOR_ROLL' || state.turn.phase === 'JAIL_DECISION') && (
                                                <button 
                                                    onClick={handleRollClick}
                                                    disabled={rolling}
                                                    className="w-full max-w-[200px] bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-black text-sm md:text-base py-3 px-6 rounded-2xl shadow-xl shadow-red-600/30 transition active:scale-95 disabled:opacity-50 flex items-center justify-center gap-2"
                                                >
                                                    <i className="fas fa-dice text-xl"></i> {rolling ? 'KOCOK...' : 'LEMPAR DADU'}
                                                </button>
                                            )}

                                            {(!myTurn || isLocalAnimating || state.turn.phase === 'ANIMATING_MOVE') && (
                                                <div className="text-xs md:text-sm font-extrabold text-slate-400 bg-slate-900/80 px-4 py-2 rounded-full border border-slate-800 flex items-center gap-2">
                                                    {isLocalAnimating ? (
                                                        <span><i className="fas fa-walking text-red-500 animate-bounce mr-1"></i> Berjalan...</span>
                                                    ) : (
                                                        <span>Menunggu {state.players[state.turn.currentPlayerId]?.name}...</span>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Sidebar */}
                        <div className="w-full lg:w-80 flex flex-col gap-3">
                            <div className="flex lg:hidden bg-slate-900 rounded-xl p-1 border border-slate-800">
                                <button onClick={() => setActiveTab('board')} className={`flex-1 py-2 text-xs font-black rounded-lg ${activeTab === 'board' ? 'bg-red-600 text-white' : 'text-slate-400'}`}>BOARD</button>
                                <button onClick={() => setActiveTab('players')} className={`flex-1 py-2 text-xs font-black rounded-lg ${activeTab === 'players' ? 'bg-red-600 text-white' : 'text-slate-400'}`}>PEMAIN</button>
                                <button onClick={() => setActiveTab('logs')} className={`flex-1 py-2 text-xs font-black rounded-lg ${activeTab === 'logs' ? 'bg-red-600 text-white' : 'text-slate-400'}`}>LOGS</button>
                            </div>

                            <div className={`bg-slate-900/90 rounded-2xl border border-slate-800 p-4 ${activeTab !== 'players' ? 'hidden lg:block' : 'block'}`}>
                                <h3 className="font-extrabold text-slate-400 uppercase text-xs tracking-wider mb-3 flex justify-between items-center">
                                    <span>DAFTAR PEMAIN</span>
                                    <span>{state.turnOrder.length} PEMAIN</span>
                                </h3>
                                <div className="space-y-2.5 max-h-56 overflow-y-auto pr-1">
                                    {state.turnOrder.map(pid => {
                                        const p = state.players[pid];
                                        const isActive = state.turn.currentPlayerId === pid;
                                        return (
                                            <div key={pid} className={`p-3 rounded-xl border transition flex items-center justify-between ${isActive ? 'border-red-500/60 bg-red-500/10' : 'border-slate-800 bg-slate-800/40'}`}>
                                                <div className="flex items-center gap-2.5">
                                                    <div className="w-3.5 h-3.5 rounded-full shadow-sm shrink-0" style={{ backgroundColor: p.color }}></div>
                                                    <div className="overflow-hidden">
                                                        <span className={`font-bold text-sm block truncate ${p.bankrupt ? 'line-through text-slate-500' : 'text-slate-200'}`}>{p.name}</span>
                                                        {p.jailStatus && <span className="text-[10px] text-rose-400 font-bold"><i className="fas fa-lock mr-1"></i>Penjara</span>}
                                                    </div>
                                                </div>
                                                <div className="text-xs font-black text-emerald-400 shrink-0 ml-2">
                                                    <AnimatedMoney amount={p.money} />
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {myTurn && (
                                <div className="bg-slate-900/90 rounded-2xl border border-slate-800 p-4">
                                    <h4 className="font-extrabold text-xs text-slate-400 uppercase tracking-wider mb-2">PROPERTI SAYA</h4>
                                    <div className="space-y-2 max-h-36 overflow-y-auto pr-1">
                                        {BOARD_TILES.filter(t => t.type === 'PROPERTY' && state.properties[t.id]?.ownerId === me.id).map(t => {
                                            const prop = state.properties[t.id];
                                            const group = GROUPS[t.group];
                                            const canUpgrade = prop.level < 4 && myPlayer.money >= group.upgradePrice;
                                            return (
                                                <div key={t.id} className="flex items-center justify-between bg-slate-800/50 p-2 rounded-xl text-xs">
                                                    <div className="flex items-center gap-2 overflow-hidden">
                                                        <div className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: group.color }}></div>
                                                        <span className="font-bold text-slate-200 truncate">{t.name} ({BUILDING_NAMES[prop.level]})</span>
                                                    </div>
                                                    {prop.level < 4 ? (
                                                        <button 
                                                            onClick={() => sendAction('UPGRADE_PROPERTY', { tileId: t.id })}
                                                            disabled={!canUpgrade}
                                                            className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white font-bold px-2.5 py-1 rounded-lg text-[10px] shrink-0 ml-2"
                                                        >
                                                            + {formatRp(group.upgradePrice).replace('Rp', '')}
                                                        </button>
                                                    ) : (
                                                        <span className="text-amber-400 font-bold text-[10px] shrink-0 ml-2">MAX</span>
                                                    )}
                                                </div>
                                            );
                                        })}
                                        {BOARD_TILES.filter(t => t.type === 'PROPERTY' && state.properties[t.id]?.ownerId === me.id).length === 0 && (
                                            <div className="text-xs text-slate-500 text-center py-2 italic">Belum ada aset properti</div>
                                        )}
                                    </div>
                                    <button 
                                        onClick={() => { if (window.confirm('Yakin ingin menyatakan bangkrut?')) sendAction('BANKRUPT_DECLARE'); }} 
                                        className="w-full mt-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 hover:bg-rose-500/20 py-2 rounded-xl font-bold text-xs transition"
                                    >
                                        NYATAKAN BANGKRUT
                                    </button>
                                </div>
                            )}

                            <div className={`bg-slate-900/90 rounded-2xl border border-slate-800 p-4 h-44 flex flex-col ${activeTab !== 'logs' ? 'hidden lg:flex' : 'flex'}`}>
                                <h3 className="font-extrabold text-slate-400 uppercase text-xs tracking-wider mb-2">AKTIVITAS</h3>
                                <div className="flex-1 overflow-y-auto text-xs space-y-1.5 pr-1">
                                    {state.logs && state.logs.map((l, i) => (
                                        <div key={i} className="text-slate-300 border-b border-slate-800/60 pb-1 font-medium">{l}</div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* STRICT POPUP MODALS - ONLY APPEARS AFTER WALKING STOPS */}
                    {showCardModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                            <div className={`max-w-sm w-full p-6 rounded-3xl border shadow-2xl text-center animate-card-pop ${state.turn.activeCard.cardType === 'CHANCE' ? 'bg-gradient-to-b from-amber-950 to-slate-900 border-amber-500/40 text-amber-100' : 'bg-gradient-to-b from-slate-900 to-indigo-950 border-indigo-500/40 text-indigo-100'}`}>
                                <div className={`w-16 h-16 mx-auto rounded-2xl flex items-center justify-center text-3xl mb-4 shadow-lg ${state.turn.activeCard.cardType === 'CHANCE' ? 'bg-amber-500 text-slate-950' : 'bg-indigo-500 text-white'}`}>
                                    <i className={`fas ${state.turn.activeCard.cardType === 'CHANCE' ? 'fa-clover' : 'fa-triangle-exclamation'}`}></i>
                                </div>
                                <span className="text-xs font-black uppercase tracking-widest opacity-75">
                                    {state.turn.activeCard.cardType === 'CHANCE' ? 'KARTU NASIB' : 'KARTU REALITA'}
                                </span>
                                <h3 className="text-xl font-black mt-2 mb-3 leading-tight">{state.turn.activeCard.text}</h3>
                                {state.turn.activeCard.amount && (
                                    <div className={`text-2xl font-black mb-6 ${state.turn.activeCard.amount > 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                        {state.turn.activeCard.amount > 0 ? `+${formatRp(state.turn.activeCard.amount)}` : formatRp(state.turn.activeCard.amount)}
                                    </div>
                                )}
                                {myTurn && (
                                    <button 
                                        onClick={() => sendAction('CLOSE_CARD_POPUP')}
                                        className="w-full py-3.5 bg-white text-slate-950 font-black rounded-xl shadow-lg hover:bg-slate-200 transition active:scale-95"
                                    >
                                        LANJUTKAN
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                    {showPropertyModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                            <div className="max-w-sm w-full bg-slate-900 rounded-3xl border border-slate-700 shadow-2xl p-6 text-center animate-card-pop">
                                {activeTile?.group && (
                                    <div className="h-4 rounded-full mb-4" style={{ backgroundColor: GROUPS[activeTile.group].color }}></div>
                                )}
                                <h3 className="text-2xl font-black text-white mb-1">{activeTile?.name}</h3>
                                <p className="text-slate-400 text-sm font-semibold mb-4">Harga: {formatRp(activeTile?.price)}</p>

                                {!canAffordProperty && (
                                    <div className="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-bold p-3 rounded-xl mb-4">
                                        <i className="fas fa-exclamation-circle mr-1"></i> Saldo tidak cukup.
                                    </div>
                                )}

                                <div className="flex gap-3">
                                    <button 
                                        onClick={() => sendAction('BUY_PROPERTY')}
                                        disabled={!canAffordProperty}
                                        className="flex-1 py-3.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-black rounded-xl shadow-lg transition active:scale-95"
                                    >
                                        BELI
                                    </button>
                                    <button 
                                        onClick={() => sendAction('SKIP_BUY')}
                                        className="flex-1 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-black rounded-xl border border-slate-700 transition active:scale-95"
                                    >
                                        LEWAT
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showJailModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                            <div className="max-w-sm w-full bg-slate-900 rounded-3xl border border-slate-700 shadow-2xl p-6 text-center animate-card-pop">
                                <div className="w-16 h-16 bg-rose-500/20 border border-rose-500/30 text-rose-400 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-3">
                                    <i className="fas fa-lock"></i>
                                </div>
                                <h3 className="text-xl font-black text-white mb-1">KAMU DI PENJARA</h3>
                                <p className="text-slate-400 text-xs font-semibold mb-6">Percobaan tersisa: {3 - (myPlayer.jailAttempts || 0)}</p>

                                <div className="space-y-2.5">
                                    <button 
                                        onClick={handleRollClick}
                                        disabled={rolling}
                                        className="w-full py-3 bg-gradient-to-r from-red-600 to-rose-600 text-white font-black rounded-xl shadow-md transition"
                                    >
                                        LEMPAR DOUBLE
                                    </button>
                                    <button 
                                        onClick={() => sendAction('PAY_JAIL')}
                                        disabled={myPlayer.money < 500000}
                                        className="w-full py-3 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 font-black rounded-xl border border-slate-700 transition"
                                    >
                                        BAYAR Rp500.000
                                    </button>
                                    {myPlayer.cards && myPlayer.cards.includes('ORANG_DALAM') && (
                                        <button 
                                            onClick={() => sendAction('USE_CARD')}
                                            className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl shadow-md transition"
                                        >
                                            PAKAI ORANG DALAM
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const App = () => {
            const [playerId] = useLocalStorage('wni_player_id', generateId());
            const [roomCode, setRoomCode] = useState(null);
            const [room, setRoom] = useState(null);
            const [players, setPlayers] = useState([]);
            
            const subs = useRef([]);

            useEffect(() => {
                if (!roomCode) return;

                const fetchInitial = async () => {
                    const { data: rm } = await supabase.from('wni_rooms').select('*').eq('code', roomCode).single();
                    if (rm) setRoom(rm);
                    const { data: pls } = await supabase.from('wni_players').select('*').eq('room_id', rm.id);
                    if (pls) setPlayers(pls);
                };
                fetchInitial();

                const roomSub = supabase.channel(`room_${roomCode}`)
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'wni_rooms', filter: `code=eq.${roomCode}` }, payload => {
                        setRoom(payload.new);
                    }).subscribe();
                
                const playersSub = supabase.channel(`players_${roomCode}`)
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'wni_players' }, payload => {
                        setPlayers(prev => {
                            const exists = prev.find(p => p.id === payload.new.id);
                            if (payload.eventType === 'DELETE') return prev.filter(p => p.id !== payload.old.id);
                            if (exists) return prev.map(p => p.id === payload.new.id ? payload.new : p);
                            return [...prev, payload.new];
                        });
                    }).subscribe();

                subs.current = [roomSub, playersSub];

                return () => {
                    subs.current.forEach(s => supabase.removeChannel(s));
                };
            }, [roomCode]);

            // Host Engine
            useEffect(() => {
                if (!room || room.status !== 'playing' || room.host_id !== playerId) return;

                const actionsSub = supabase.channel(`actions_${room.id}`)
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'wni_actions', filter: `room_id=eq.${room.id}` }, async payload => {
                        const action = payload.new;
                        
                        let logQueue = [];
                        const logMsg = (msg) => logQueue.push(`[${new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}] ${msg}`);
                        
                        const newState = processAction(room.state, action, logMsg);
                        newState.logs = [...logQueue, ...(newState.logs || [])].slice(0, 50);

                        await supabase.from('wni_rooms').update({ state: newState }).eq('id', room.id);
                        
                        if (newState.status === 'game_over') {
                            await supabase.from('wni_rooms').update({ status: 'finished' }).eq('id', room.id);
                        }
                    }).subscribe();

                return () => supabase.removeChannel(actionsSub);
            }, [room, playerId]);

            const handleCreateRoom = async (name) => {
                const code = Math.random().toString(36).substring(2, 6).toUpperCase();
                const { data: newRoom, error: roomErr } = await supabase.from('wni_rooms').insert([
                    { code, host_id: playerId }
                ]).select().single();

                if (roomErr) return alert('Gagal membuat room. Cek koneksi.');

                await supabase.from('wni_players').insert([
                    { id: playerId, room_id: newRoom.id, name, color: COLORS[0], is_ready: true }
                ]);
                
                setRoomCode(code);
            };

            const handleJoinRoom = async (code, name) => {
                const { data: rm, error } = await supabase.from('wni_rooms').select('*').eq('code', code).single();
                if (error || !rm) return alert('Room tidak ditemukan!');
                if (rm.status !== 'waiting') return alert('Game sudah dimulai!');

                const { data: existingPlayers } = await supabase.from('wni_players').select('*').eq('room_id', rm.id);
                if (existingPlayers.length >= 8) return alert('Room penuh!');
                
                const existingMe = existingPlayers.find(p => p.id === playerId);
                if (!existingMe) {
                    await supabase.from('wni_players').insert([
                        { id: playerId, room_id: rm.id, name, color: COLORS[existingPlayers.length % COLORS.length] }
                    ]);
                }
                setRoomCode(code);
            };

            const handleReady = async (isReady) => {
                setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, is_ready: isReady } : p));
                await supabase.from('wni_players').update({ is_ready: isReady }).eq('id', playerId);
            };

            const handleStartGame = async () => {
                const turnOrder = players.map(p => p.id).sort(() => Math.random() - 0.5);
                
                const initialState = {
                    code: roomCode,
                    status: 'playing',
                    turnOrder,
                    turn: {
                        currentIndex: 0,
                        currentPlayerId: turnOrder[0],
                        phase: 'WAITING_FOR_ROLL',
                        doublesCount: 0,
                        lastDice: null,
                        targetPosition: 0
                    },
                    players: {},
                    properties: {},
                    logs: ['Game dimulai!']
                };

                players.forEach(p => {
                    initialState.players[p.id] = {
                        id: p.id,
                        name: p.name,
                        color: p.color,
                        money: 15000000,
                        position: 0,
                        jailStatus: false,
                        jailAttempts: 0,
                        bankrupt: false,
                        cards: []
                    };
                });

                BOARD_TILES.forEach(t => {
                    if (['PROPERTY', 'TRANSPORT'].includes(t.type)) {
                        initialState.properties[t.id] = { ownerId: null, level: 0, mortgaged: false };
                    }
                });

                await supabase.from('wni_rooms').update({ 
                    status: 'playing', 
                    state: initialState 
                }).eq('id', room.id);
            };

            const sendAction = async (type, payload = {}) => {
                await supabase.from('wni_actions').insert([{
                    room_id: room.id,
                    player_id: playerId,
                    type,
                    payload
                }]);
            };

            const handleLeave = () => {
                supabase.from('wni_players').delete().eq('id', playerId).then(() => {
                    setRoomCode(null);
                    setRoom(null);
                    setPlayers([]);
                });
            };

            if (!roomCode || !room) {
                return <Home onJoin={handleJoinRoom} onCreate={handleCreateRoom} />;
            }

            const me = players.find(p => p.id === playerId);
            if (!me) return <div className="p-8 text-center text-slate-400">Menghubungkan ke room...</div>;

            if (room.status === 'waiting') {
                return <Lobby room={room} players={players} me={me} onReady={handleReady} onStart={handleStartGame} onLeave={handleLeave} />;
            }
            
            if (room.status === 'finished') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950">
                        <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl text-center shadow-2xl max-w-md w-full animate-card-pop">
                            <div className="w-20 h-20 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-full flex items-center justify-center text-4xl mx-auto mb-4">
                                <i className="fas fa-trophy"></i>
                            </div>
                            <h1 className="text-3xl font-black text-white mb-2">GAME OVER</h1>
                            <p className="text-lg mb-6 text-slate-300">Pemenang: <span className="font-extrabold text-amber-400">{room.state.players[room.state.winner]?.name}</span></p>
                            <button onClick={handleLeave} className="w-full bg-slate-800 hover:bg-slate-700 text-white py-4 rounded-xl font-black transition">KEMBALI KE MENU</button>
                        </div>
                    </div>
                );
            }

            return <GameBoard state={room.state} me={me} sendAction={sendAction} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
